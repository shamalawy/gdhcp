version: 2
updates:
  # Go dependencies
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    labels:
      - "dependencies"
      - "go"
    reviewers:
      - "shamalawy"
    allow:
      - dependency-type: "production"
      - dependency-type: "development"

  # npm dependencies (web frontend)
  - package-ecosystem: "npm"
    directory: "web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:15"
    labels:
      - "dependencies"
      - "frontend"
    reviewers:
      - "shamalawy"
    allow:
      - dependency-type: "production"
      - dependency-type: "development"
    # The frontend is pinned to Angular 18 on purpose (amendment A9), and the
    # whole @angular/* set has to move together. Major bumps opened one package
    # at a time cannot pass CI, so they are handled as a deliberate migration
    # rather than as dependency noise. Patch and minor updates still come through.
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "zone.js"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:30"
    labels:
      - "dependencies"
      - "ci"
    reviewers:
      - "shamalawy"

  # Container images
  - package-ecosystem: "docker"
    directory: "deploy/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:45"
    labels:
      - "dependencies"
      - "docker"
    reviewers:
      - "shamalawy"
