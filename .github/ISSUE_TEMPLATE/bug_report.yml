name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please provide as much detail as possible to help us reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: Brief description of the bug
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Start the server with...
        2. Create a scope with...
        3. Try to allocate a lease by...
        4. Observe the bug
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
      placeholder: |
        The lease should have been allocated to 10.0.1.100, but instead...
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      description: How did you deploy gdhcp?
      options:
        - Docker Compose
        - Bare metal (systemd)
        - Kubernetes
        - Built from source
        - go install
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: gdhcp version
      description: Output of `gdhcp version` or GET /api/v1/health
      placeholder: "v0.1.0 (abc1234, 2026-08-30T12:00:00Z)"
    validations:
      required: true

  - type: input
    id: postgres
    attributes:
      label: PostgreSQL version
      description: Version of your PostgreSQL instance
      placeholder: "14"
    validations:
      required: true

  - type: dropdown
    id: ha
    attributes:
      label: HA enabled?
      options:
        - "No, standalone"
        - "Yes, cluster mode"
        - "Unsure"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error messages
      description: Paste error messages, server logs, or API response
      render: text
      placeholder: |
        2026-08-30T12:34:56Z ERROR failed to allocate lease: ...

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: Paste sanitized portions of config.yaml or env vars (remove secrets)
      render: yaml
      placeholder: |
        dhcp:
          interfaces:
            - name: eth0
              vrf_id: default
          default_lease_time: 86400
        ha:
          enabled: false
