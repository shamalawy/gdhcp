name: Release

# Triggered by pushing a tag matching v* (e.g. `git tag v0.1.0 && git push origin v0.1.0`),
# or manually via workflow_dispatch as a DRY RUN.
#
# The dry run builds every artifact but publishes none of them: `github.ref_name` on a
# manual dispatch is a branch name, so publishing would cut a GitHub Release named after
# the branch. The `startsWith(github.ref, 'refs/tags/')` guard on publish-release is what
# keeps that from happening — do not remove it to "simplify" the file.
#
# There is deliberately no container-image job yet. Publishing to ghcr.io is planned but
# not wired up; deploy/docker/Dockerfile still builds locally in the meantime.
#
# Artifacts on a tag:
#   - gdhcp-<tag>-linux-{amd64,arm64}.tar.gz + SHA256SUMS.txt
#   - .deb and .rpm for both architectures
#   - a GitHub Release carrying all of the above

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "20"

jobs:
  web:
    name: build Angular frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  build-tarballs:
    name: build release tarballs (linux/amd64, linux/arm64)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: download web build
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - name: build tarballs and checksums
        # SKIP_WEB_BUILD=1 because the web job already produced web/dist and this
        # runner has no node. github.event.head_commit is null on a tag push, so
        # BUILD_DATE is stamped here rather than read from the event payload.
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # Short SHA to match what the Makefile stamps locally, so
          # `gdhcp version` reads the same from a release build and a dev build.
          export COMMIT="$(git rev-parse --short HEAD)"
          export BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SKIP_WEB_BUILD=1 scripts/build/release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-tarballs
          path: dist/release
          retention-days: 7

  build-packages:
    name: build .deb and .rpm packages
    needs: build-tarballs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: download release tarballs
        uses: actions/download-artifact@v8
        with:
          name: release-tarballs
          path: dist/release
      - name: install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - name: build deb and rpm for both architectures
        # PKG_VERSION drops the leading "v": a Debian version must start with a
        # digit, so "v0.1.0" produces an invalid package. nfpm.yaml reads
        # PKG_VERSION and ARCH from the environment.
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          export PATH="${PATH}:$(go env GOPATH)/bin"
          export PKG_VERSION="${VERSION#v}"
          mkdir -p dist/packages
          for arch in amd64 arm64; do
            export ARCH="$arch"
            # Each tarball holds ./gdhcp and ./config.yaml.example; nfpm.yaml
            # reads the binary from dist/gdhcp, so unpack over it per arch.
            tar -xzf "dist/release/gdhcp-${VERSION}-linux-${arch}.tar.gz" -C dist/
            nfpm package -f nfpm.yaml -p deb -t dist/packages/
            nfpm package -f nfpm.yaml -p rpm -t dist/packages/
          done
          ls -l dist/packages
      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: dist/packages
          retention-days: 7

  publish-release:
    name: publish the GitHub Release
    needs: [build-tarballs, build-packages]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: collect artifacts and re-checksum
        # release.sh checksums only the tarballs; the packages are built in a
        # later job, so SHA256SUMS.txt is regenerated here over everything the
        # release actually ships.
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/release-tarballs/*.tar.gz release/
          cp artifacts/release-packages/* release/
          ( cd release && sha256sum ./* > SHA256SUMS.txt )
          cat release/SHA256SUMS.txt
      - name: create the release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          # Any tag carrying a hyphen (v0.1.0-rc.1) ships as a prerelease.
          prerelease: ${{ contains(github.ref_name, '-') }}
