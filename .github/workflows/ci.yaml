name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  go:
    name: go vet, test, build
    needs: web
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gdhcp
          POSTGRES_USER: gdhcp
          POSTGRES_PASSWORD: gdhcp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gdhcp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      GDHCP_DATABASE_DSN: "postgres://gdhcp:gdhcp@localhost:5432/gdhcp?sslmode=disable"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: download web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: build (CGO_ENABLED=0 per amendment A3)
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -o dist/gdhcp ./server/cmd/gdhcp
      - uses: actions/upload-artifact@v4
        with:
          name: gdhcp-linux-amd64
          path: dist/gdhcp
          retention-days: 7

  shellcheck-syntax:
    name: shell script syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n every script
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' f; do
            echo "checking $f"
            bash -n "$f" || status=1
          done < <(find scripts deploy -type f -name '*.sh' -print0)
          exit "$status"
