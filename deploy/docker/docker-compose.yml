# gdhcp local/production Docker Compose stack.
# Container names are fixed per project convention (never Compose-generated
# names): gdhcp_server, gdhcp_postgres.
#
# Usage:
#   docker compose -f deploy/docker/docker-compose.yml up -d --build
#   docker compose -f deploy/docker/docker-compose.yml logs -f gdhcp_server
#   docker compose -f deploy/docker/docker-compose.yml down          # keep volumes
#   docker compose -f deploy/docker/docker-compose.yml down -v       # wipe DB too

services:
  gdhcp_postgres:
    image: postgres:16-alpine
    container_name: gdhcp_postgres
    environment:
      POSTGRES_DB: gdhcp
      POSTGRES_USER: gdhcp
      POSTGRES_PASSWORD: ${GDHCP_DB_PASSWORD:-gdhcp_dev_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - gdhcp_pgdata:/var/lib/postgresql/data
    ports:
      # Bound to localhost only — the DB is not meant to be reachable from
      # outside the host. Drop this entirely in production if gdhcp_server
      # is the only client (it talks to gdhcp_postgres over the internal
      # Docker network, not this published port).
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gdhcp -d gdhcp"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  gdhcp_server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        VERSION: ${GDHCP_VERSION:-dev}
        BUILD_TIME: ${GDHCP_BUILD_TIME:-unknown}
        GIT_COMMIT: ${GDHCP_GIT_COMMIT:-unknown}
    container_name: gdhcp_server
    depends_on:
      gdhcp_postgres:
        condition: service_healthy
    # CRITICAL: host networking. DHCP clients send broadcast packets to
    # UDP/67 on the local L2 segment; Docker's bridge network does not
    # forward broadcasts, and DHCP replies frequently need to be sent to
    # the client's hardware address before it has an IP (dhcpv4 handles
    # this at the socket level, which also requires the host's real
    # interfaces). With network_mode: host, gdhcp_postgres above is
    # reached at localhost:5432, hence the DSN below.
    network_mode: "host"
    cap_add:
      - NET_ADMIN   # VIP assignment via netlink (HA failover)
      - NET_RAW     # gratuitous ARP after VIP move
    environment:
      GDHCP_DATABASE_DSN: "postgres://gdhcp:${GDHCP_DB_PASSWORD:-gdhcp_dev_password}@localhost:5432/gdhcp?sslmode=disable"
      GDHCP_LOGGING_LEVEL: ${GDHCP_LOG_LEVEL:-info}
    volumes:
      - ./config.yaml:/etc/gdhcp/config.yaml:ro
      - gdhcp_data:/var/lib/gdhcp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

volumes:
  gdhcp_pgdata:
    driver: local
  gdhcp_data:
    driver: local
