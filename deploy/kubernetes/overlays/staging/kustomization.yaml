apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staging and production both deploy resources named "gdhcp" into the
# "gdhcp" namespace — this assumes staging runs on a separate cluster (or at
# minimum a separate node pool selected by the gdhcp.io/dhcp-node label)
# from production, not side-by-side in the same cluster. Two DHCP servers
# answering on the same broadcast segment is a split-brain footgun
# regardless of Kubernetes namespacing.
namespace: gdhcp

resources:
  - ../../base

commonLabels:
  app.kubernetes.io/environment: staging

images:
  - name: gdhcp
    newTag: latest   # staging tracks the latest build, unlike production

# Staging keeps the base's small resource requests/limits and 10Gi Postgres
# volume as-is — no patches needed. Point secrets at a real (but
# non-production) database the same way production does:
secretGenerator:
  - name: gdhcp-db-credentials
    envs:
      - .env.secret
    behavior: replace
  - name: gdhcp-server-credentials
    envs:
      - .jwt.secret
    behavior: replace
