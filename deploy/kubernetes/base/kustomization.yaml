apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gdhcp

commonLabels:
  app.kubernetes.io/name: gdhcp
  app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - postgres
  - gdhcp

images:
  - name: gdhcp
    newName: gdhcp
    newTag: latest   # overridden per overlay
