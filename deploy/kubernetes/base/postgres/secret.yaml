# Placeholder credentials for `kubectl apply -k base` smoke tests only.
# Every real overlay MUST replace this — overlays/production and
# overlays/staging both do, via secretGenerator with `behavior: replace`
# reading from a gitignored .env.secret file. Never commit real credentials
# here.
apiVersion: v1
kind: Secret
metadata:
  name: gdhcp-db-credentials
  labels:
    app.kubernetes.io/component: database
type: Opaque
stringData:
  username: gdhcp
  password: changeme
  database: gdhcp
  dsn: "postgres://gdhcp:changeme@gdhcp-postgres:5432/gdhcp?sslmode=disable"
