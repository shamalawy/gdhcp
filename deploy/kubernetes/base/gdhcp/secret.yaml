# jwt-signing secret and (optional) TLS material for the gdhcp API/UI pods.
# Database credentials are NOT duplicated here — the DaemonSet reads
# GDHCP_DATABASE_DSN from the gdhcp-db-credentials Secret defined in
# ../postgres/secret.yaml, which every overlay already replaces with real
# values. Replace jwt_secret the same way in any multi-replica overlay
# (leaving it "" means every pod restart invalidates all sessions
# differently per pod, per amendment A11).
apiVersion: v1
kind: Secret
metadata:
  name: gdhcp-server-credentials
type: Opaque
stringData:
  jwt_secret: "changeme-generate-a-real-32-byte-random-value"
  # tls_cert: ""
  # tls_key: ""
